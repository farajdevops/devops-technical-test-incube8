apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-api
  namespace: auth-api
  labels:
    app.kubernetes.io/name: auth-api
  # annotations:
  #   # Uncomment if the app needs AWS APIs (IRSA)
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/auth-api
# The API does not talk to the Kubernetes API, so no token is mounted.
automountServiceAccountToken: false
