apiVersion: v1
kind: Service
metadata:
  name: auth-api
  namespace: auth-api
  labels:
    app.kubernetes.io/name: auth-api
spec:
  type: ClusterIP   # internal only - exposed externally via the Ingress
  selector:
    app.kubernetes.io/name: auth-api
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
