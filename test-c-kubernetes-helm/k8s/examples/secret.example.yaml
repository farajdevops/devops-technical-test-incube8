# !! TEMPLATE ONLY - DO NOT COMMIT REAL VALUES !!
#
# The values below are placeholders so the *structure* is clear. Create the real
# Secret out-of-band and never put it in git:
#
#   kubectl -n auth-api create secret generic auth-api-secrets \
#     --from-literal=DATABASE_URL='postgresql://USER:PASS@<rds-endpoint>:5432/authdb' \
#     --from-literal=REDIS_URL='redis://default:PASS@<elasticache-endpoint>:6379'
#
# For GitOps use External Secrets Operator (AWS Secrets Manager) or Sealed
# Secrets; the Deployment only references the Secret by name.
apiVersion: v1
kind: Secret
metadata:
  name: auth-api-secrets
  namespace: auth-api
  labels:
    app.kubernetes.io/name: auth-api
type: Opaque
stringData:
  DATABASE_URL: postgresql://user:password@rds-endpoint:5432/authdb
  REDIS_URL: redis://default:password@elasticache-endpoint:6379
