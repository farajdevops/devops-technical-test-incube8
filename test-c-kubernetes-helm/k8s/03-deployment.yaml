apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
  namespace: auth-api
  labels:
    app.kubernetes.io/name: auth-api
    app.kubernetes.io/component: api
spec:
  # 3 = minimum. The HPA (06-hpa.yaml) takes over scaling from here.
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Zero-downtime: start one extra pod, only remove an old one once the
      # new one is Ready.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: auth-api
      automountServiceAccountToken: false
      # Graceful shutdown: SIGTERM -> app drains in-flight requests (<= 20s per
      # config.json) -> SIGKILL after 30s.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas over nodes and AZs so a node/AZ failure keeps quorum.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: auth-api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: auth-api
      containers:
        - name: auth-api
          image: 123456789012.dkr.ecr.us-west-2.amazonaws.com/auth-api:v1.2.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-api-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: auth-api-secrets
                  key: REDIS_URL
            - name: LOG_LEVEL
              value: "info"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Startup probe gives slow boots time (10s + up to 30 x 5s) without
          # loosening the liveness probe. Liveness/readiness start after it passes.
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          # Liveness: restart a wedged container.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness: only receive traffic when DB/Redis are reachable.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          lifecycle:
            preStop:
              # Give the ingress controller/endpoints time to stop routing to
              # this pod before SIGTERM reaches the app.
              exec:
                command: ["sh", "-c", "sleep 10"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: auth-api-config
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
