apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-api
  namespace: auth-api
  labels:
    app.kubernetes.io/name: auth-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: auth-api
  policyTypes:
    - Ingress
    - Egress   # selecting Egress here makes everything not listed below DENIED
  ingress:
    # Only the ingress-nginx controller may reach the app, only on its port.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # DNS (CoreDNS pods are labelled k8s-app=kube-dns)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # RDS PostgreSQL - replace with your RDS subnet CIDR(s)
    - to:
        - ipBlock:
            cidr: 10.0.20.0/24
      ports:
        - protocol: TCP
          port: 5432
    # ElastiCache Redis - replace with your ElastiCache subnet CIDR(s)
    - to:
        - ipBlock:
            cidr: 10.0.30.0/24
      ports:
        - protocol: TCP
          port: 6379
