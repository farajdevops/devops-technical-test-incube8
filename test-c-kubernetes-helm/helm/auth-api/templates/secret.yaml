{{- /*
  Only rendered when secret.create=true (intended for dev). In staging/prod keep
  secret.create=false and point secret.existingSecret at a Secret managed by
  External Secrets / Sealed Secrets, so credentials never pass through Helm values.
*/ -}}
{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "auth-api.secretName" . }}
  labels:
    {{- include "auth-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secret.databaseUrl is required when secret.create=true" .Values.secret.databaseUrl | quote }}
  REDIS_URL: {{ required "secret.redisUrl is required when secret.create=true" .Values.secret.redisUrl | quote }}
{{- end }}
