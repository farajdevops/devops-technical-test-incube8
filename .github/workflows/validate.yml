name: Validate Kubernetes manifests and Helm chart

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test-c-kubernetes-helm
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate plain manifests (Kubernetes 1.28 schemas)
        run: kubeconform -strict -summary -kubernetes-version 1.28.0 k8s/*.yaml

      - name: Helm lint (all environments)
        run: |
          for env in dev staging prod; do
            helm lint helm/auth-api -f helm/auth-api/values-$env.yaml
          done

      - name: Helm template + schema validation (all environments)
        run: |
          for env in dev staging prod; do
            helm template auth-api helm/auth-api -f helm/auth-api/values-$env.yaml \
              | kubeconform -strict -summary -kubernetes-version 1.28.0 -
          done

      - name: Prod renders no Secret and no fixed replica count
        run: |
          helm template auth-api helm/auth-api -f helm/auth-api/values-prod.yaml > /tmp/prod.yaml
          ! grep -q "kind: Secret" /tmp/prod.yaml
          ! grep -q "^  replicas:" /tmp/prod.yaml

EOF
